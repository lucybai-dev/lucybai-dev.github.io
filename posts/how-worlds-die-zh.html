<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界是如何死去的 - Lucy Bai</title>
  <meta name="description" content="当真相不可观测时，我们该如何推理？">
  <meta property="article:published_time" content="2026-06-27">
  <meta property="article:modified_time" content="2026-07-28">
  <link rel="stylesheet" href="/style.css">
  <style>
    .figure { margin: 2rem 0; }
    .figure img { display: block; width: 100%; max-width: 980px; height: auto; border-radius: 24px; }
    #post table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 14px; line-height: 1.45; }
    #post th, #post td { border: 1px solid var(--line); padding: 9px 10px; text-align: left; vertical-align: top; }
    #post th { font-weight: 600; background: #fafafa; }
    @media(max-width:700px){ #post table { display:block; overflow-x:auto; white-space:nowrap; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="site-header">
      <a class="logo" href="/">Lucy Bai</a>
      <nav>
        <a href="/writing.html">Notes</a>
        <a href="/projects.html">Projects</a>
      </nav>
    </header>
    <article id="post"></article>
    <noscript>
      <article>
        <p class="eyebrow">发布于 2026.06.27 · 更新于 2026.07.28 · 中文</p>
        <h1>世界是如何死去的</h1>
        <p class="intro">当真相不可观测时，我们该如何推理？</p>
        <p><a href="/posts/20260627-how-worlds-die-zh.md">阅读 Markdown 源文</a></p>
      </article>
    </noscript>
  </main>
  <script>
    const src = '/posts/20260627-how-worlds-die-zh.md';
    const post = document.getElementById('post');
    const pageTitle = '世界是如何死去的';
    const mapTitle = '地图';
    const langSwitch = '<a href="/posts/how-worlds-die.html">English</a>';
    function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
    function escapeAttr(s){return escapeHtml(s).replace(/"/g,'&quot;');}
    function inline(s){return escapeHtml(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>');}
    function slugify(s){return s.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').replace(/^-+|-+$/g,'');}
    function splitTableRow(line){return line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim());}
    function publishedAsset(path){return path.replace(/^\/draft\/assets\//,'/posts/assets/');}
    function render(md){
      const lines = md.split(/\r?\n/);
      const headings = lines.filter(l=>l.trim().startsWith('## ')).map(l=>l.trim().slice(3));
      const used = {};
      const ids = headings.map(h=>{let base=slugify(h)||'section';let id=base;used[base]=(used[base]||0)+1;if(used[base]>1)id=base+'-'+used[base];return id;});
      const toc = headings.length?'<nav class="toc"><p class="toc-title">'+mapTitle+'</p>'+headings.map((h,i)=>'<a href="#'+ids[i]+'">'+inline(h)+'</a>').join('')+'</nav>':'';
      let html = '<p class="eyebrow">发布于 2026.06.27 · 更新于 2026.07.28 · 中文 · '+langSwitch+'</p>';
      let para=[],quote=[],list=[],listType='',h2Index=0,seenH1=false,insertedToc=false,usedIntro=false,inCode=false,code=[];
      function maybeToc(){if(seenH1&&usedIntro&&!insertedToc&&toc){html+=toc;insertedToc=true;}}
      function flushPara(){if(para.length){html+='<p>'+inline(para.join(' '))+'</p>';para=[];maybeToc();}}
      function flushQuote(){if(quote.length){html+='<blockquote><p>'+quote.map(inline).join('<br>')+'</p></blockquote>';quote=[];maybeToc();}}
      function flushList(){if(list.length){html+='<'+listType+'>'+list.map(item=>'<li>'+inline(item)+'</li>').join('')+'</'+listType+'>';list=[];listType='';maybeToc();}}
      function flushCode(){if(code.length){html+='<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>';code=[];maybeToc();}}
      for(let i=0;i<lines.length;i++){
        const raw=lines[i];
        if(raw.trim().startsWith('```')){flushPara();flushQuote();flushList();if(inCode){flushCode();inCode=false;}else{inCode=true;}continue;}
        if(inCode){code.push(raw);continue;}
        const line=raw.trim();
        if(!line){flushPara();flushQuote();flushList();continue;}
        if(line.startsWith('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+/.test(lines[i+1])){
          flushPara();flushQuote();flushList();const headers=splitTableRow(line);i++;const rows=[];while(i+1<lines.length&&lines[i+1].trim().startsWith('|'))rows.push(splitTableRow(lines[++i]));html+='<table><thead><tr>'+headers.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+headers.map((_,j)=>'<td>'+inline(row[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';maybeToc();continue;
        }
        const img=line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);if(img){flushPara();flushQuote();flushList();html+='<figure class="figure"><img src="'+escapeAttr(publishedAsset(img[2]))+'" alt="'+escapeAttr(img[1])+'"></figure>';maybeToc();continue;}
        if(line.startsWith('>')){flushPara();flushList();quote.push(line.replace(/^>\s?/,''));continue;}
        flushQuote();
        const ul=line.match(/^[-*]\s+(.+)$/);const ol=line.match(/^\d+\.\s+(.+)$/);if(ul||ol){flushPara();const type=ul?'ul':'ol';if(listType&&listType!==type)flushList();listType=type;list.push((ul||ol)[1]);continue;}
        flushList();
        if(line.startsWith('# ')){flushPara();html+='<h1>'+inline(pageTitle)+'</h1>';seenH1=true;continue;}
        if(seenH1&&!usedIntro&&/^\*[^*]+\*$/.test(line)){flushPara();html+='<p class="intro">'+inline(line.replace(/^\*|\*$/g,''))+'</p>';usedIntro=true;maybeToc();continue;}
        if(line.startsWith('## ')){flushPara();const title=line.slice(3);html+='<h2 id="'+ids[h2Index++]+'">'+inline(title)+'</h2>';continue;}
        if(line.startsWith('### ')){flushPara();html+='<h3>'+inline(line.slice(4))+'</h3>';continue;}
        para.push(line);
      }
      flushPara();flushQuote();flushList();flushCode();if(!insertedToc&&toc)html+=toc;post.innerHTML=html;
    }
    fetch(src,{cache:'no-store'}).then(r=>r.text()).then(render).catch(()=>{post.innerHTML='<p>Unable to load post.</p>';});
  </script>
</body>
</html>
