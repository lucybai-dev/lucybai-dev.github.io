<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 675" role="img" aria-labelledby="title desc">
  <title id="title">From traditional tools to canonical agentic execution</title>
  <desc id="desc">Four panels compare traditional one-to-one tools, many-to-one AI chatbots, one-to-many AI agents, and agentic execution that converges coordinated changes into one canonical repository state.</desc>
  <defs>
    <style>
      .t{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;fill:#111}
      .heading{font-size:27px;font-weight:700}
      .boxtext{font-size:18px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
      .small{font-size:18px;font-weight:500}
      .formula{font-size:28px;font-weight:650;fill:#0b45a6;text-anchor:middle}
      .num{font-size:28px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .line{stroke:#0b45a6;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .divider{stroke:#c9ced8;stroke-width:1.5}
      .box{fill:#fff;stroke:#111827;stroke-width:1.6;rx:7}
      .circle{fill:#fff;stroke:#111827;stroke-width:1.7}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0b45a6"/>
    </marker>
  </defs>
  <rect width="1672" height="675" fill="#fff"/>
  <line x1="358" y1="34" x2="358" y2="646" class="divider"/>
  <line x1="729" y1="34" x2="729" y2="646" class="divider"/>
  <line x1="1150" y1="34" x2="1150" y2="646" class="divider"/>

  <circle cx="87" cy="63" r="23" fill="#0b45a6"/><text x="87" y="64" class="t num">1</text>
  <text x="133" y="73" class="t heading">Traditional tools</text>
  <rect x="18" y="285" width="96" height="61" class="box"/><text x="66" y="316" class="t boxtext">Information</text>
  <rect x="149" y="285" width="85" height="61" class="box"/><text x="191" y="316" class="t boxtext">Decision</text>
  <rect x="265" y="285" width="75" height="61" class="box"/><text x="302" y="316" class="t boxtext">Action</text>
  <path d="M114 316 H149" class="line"/><path d="M234 316 H265" class="line"/>
  <text x="179" y="610" class="t formula">1 → 1 → 1</text>

  <circle cx="466" cy="63" r="23" fill="#0b45a6"/><text x="466" y="64" class="t num">2</text>
  <text x="505" y="73" class="t heading">AI chatbot</text>
  <rect x="380" y="135" width="94" height="55" class="box"/><text x="427" y="163" class="t boxtext">Docs</text>
  <rect x="380" y="230" width="94" height="55" class="box"/><text x="427" y="258" class="t boxtext">Code</text>
  <rect x="380" y="330" width="94" height="55" class="box"/><text x="427" y="358" class="t boxtext">History</text>
  <rect x="380" y="425" width="94" height="55" class="box"/><text x="427" y="453" class="t boxtext">Context</text>
  <circle cx="570" cy="314" r="55" class="circle"/><text x="570" y="315" class="t boxtext">Decision</text>
  <rect x="641" y="285" width="73" height="58" class="box"/><text x="678" y="314" class="t boxtext">Action</text>
  <path d="M474 163 L532 270" class="line"/><path d="M474 258 L520 294" class="line"/><path d="M474 358 L519 333" class="line"/><path d="M474 453 L531 359" class="line"/><path d="M625 314 H641" class="line"/>
  <text x="548" y="610" class="t formula">N → 1 → 1</text>

  <circle cx="866" cy="63" r="23" fill="#0b45a6"/><text x="866" y="64" class="t num">3</text>
  <text x="906" y="73" class="t heading">AI agent</text>
  <rect x="749" y="156" width="77" height="53" class="box"/><text x="787" y="183" class="t boxtext">Docs</text>
  <rect x="749" y="241" width="77" height="53" class="box"/><text x="787" y="268" class="t boxtext">Code</text>
  <rect x="749" y="330" width="77" height="53" class="box"/><text x="787" y="357" class="t boxtext">History</text>
  <rect x="749" y="416" width="77" height="53" class="box"/><text x="787" y="443" class="t boxtext">Context</text>
  <circle cx="930" cy="314" r="58" class="circle"/><text x="930" y="304" class="t boxtext">Semantic</text><text x="930" y="326" class="t boxtext">decision</text>
  <rect x="1028" y="132" width="90" height="53" class="box"/><text x="1073" y="159" class="t boxtext">Model</text>
  <rect x="1028" y="208" width="90" height="53" class="box"/><text x="1073" y="235" class="t boxtext">Callers</text>
  <rect x="1028" y="284" width="90" height="53" class="box"/><text x="1073" y="311" class="t boxtext">Tests</text>
  <rect x="1028" y="360" width="90" height="53" class="box"/><text x="1073" y="387" class="t boxtext">Fixtures</text>
  <rect x="1028" y="437" width="97" height="53" class="box"/><text x="1076" y="464" class="t boxtext">Verification</text>
  <path d="M826 183 L886 273" class="line"/><path d="M826 268 L873 296" class="line"/><path d="M826 357 L874 333" class="line"/><path d="M826 443 L887 355" class="line"/>
  <path d="M971 276 L1028 159" class="line"/><path d="M979 294 L1028 235" class="line"/><path d="M988 314 H1028" class="line"/><path d="M979 334 L1028 387" class="line"/><path d="M970 353 L1028 464" class="line"/>
  <text x="929" y="610" class="t formula">N → 1 → M</text>

  <circle cx="1261" cy="63" r="23" fill="#0b45a6"/><text x="1261" y="64" class="t num">4</text>
  <text x="1302" y="73" class="t heading">Canonical agentic execution</text>
  <rect x="1168" y="156" width="74" height="53" class="box"/><text x="1205" y="183" class="t boxtext">Docs</text>
  <rect x="1168" y="241" width="74" height="53" class="box"/><text x="1205" y="268" class="t boxtext">Code</text>
  <rect x="1168" y="330" width="74" height="53" class="box"/><text x="1205" y="357" class="t boxtext">History</text>
  <rect x="1168" y="416" width="74" height="53" class="box"/><text x="1205" y="443" class="t boxtext">Context</text>
  <circle cx="1322" cy="314" r="57" class="circle"/><text x="1322" y="304" class="t boxtext">Semantic</text><text x="1322" y="326" class="t boxtext">decision</text>
  <rect x="1411" y="132" width="78" height="53" class="box"/><text x="1450" y="159" class="t boxtext">Model</text>
  <rect x="1411" y="208" width="78" height="53" class="box"/><text x="1450" y="235" class="t boxtext">Callers</text>
  <rect x="1411" y="284" width="78" height="53" class="box"/><text x="1450" y="311" class="t boxtext">Tests</text>
  <rect x="1411" y="360" width="78" height="53" class="box"/><text x="1450" y="387" class="t boxtext">Fixtures</text>
  <rect x="1411" y="437" width="84" height="53" class="box"/><text x="1453" y="464" class="t boxtext">Verification</text>
  <circle cx="1599" cy="314" r="55" class="circle"/><text x="1599" y="303" class="t boxtext">Canonical</text><text x="1599" y="325" class="t boxtext">state</text>
  <path d="M1242 183 L1280 273" class="line"/><path d="M1242 268 L1269 296" class="line"/><path d="M1242 357 L1270 334" class="line"/><path d="M1242 443 L1281 355" class="line"/>
  <path d="M1362 276 L1411 159" class="line"/><path d="M1370 294 L1411 235" class="line"/><path d="M1379 314 H1411" class="line"/><path d="M1370 334 L1411 387" class="line"/><path d="M1361 353 L1411 464" class="line"/>
  <path d="M1489 159 L1557 281" class="line"/><path d="M1489 235 L1549 298" class="line"/><path d="M1489 311 L1544 314" class="line"/><path d="M1489 387 L1550 332" class="line"/><path d="M1495 464 L1560 348" class="line"/>
  <path d="M1599 369 V463" stroke="#0b45a6" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <text x="1538" y="491" class="t small">bounded actions</text><text x="1538" y="516" class="t small">converge to one</text><text x="1538" y="541" class="t small">repository state</text>
  <text x="1410" y="610" class="t formula">N → 1 → M → 1</text>
</svg>
