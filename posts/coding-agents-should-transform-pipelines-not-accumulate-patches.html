<body>
  <main class="page">
    <header class="site-header">

    <article id="post"></article>
    <noscript>
      <article>
        <p class="eyebrow">Agent-Operated Repositories · 01 · English · <a href="/posts/coding-agents-should-transform-pipelines-not-accumulate-patches-zh.html">中文</a></p>
        <h1>Coding Agents Should Transform Pipelines, Not Accumulate Patches</h1>
        <p class="intro">A proposal for bounded pipeline transformations as the unit of agentic software change</p>
        <p><a href="/posts/20260917-coding-agents-should-transform-pipelines-not-accumulate-patches.md">Read the Markdown source</a></p>

    <footer>
      <p>Lucy Bai · <a class="text-link" href="mailto:Ruyu.bai@foxmail.com">Email</a> · <a class="text-link" href="https://www.linkedin.com/in/lucy-bai-tech/" target="_blank" rel="noopener noreferrer">LinkedIn</a> · notes in progress</p>
    </footer>
  </main>

  <script>
    const src='/posts/20260917-coding-agents-should-transform-pipelines-not-accumulate-patches.md';
    const post=document.getElementById('post');
    const langSwitch='<a href="/posts/coding-agents-should-transform-pipelines-not-accumulate-patches-zh.html">中文</a>';
    function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
    function inline(s){
      return esc(s)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g,'<em>$1</em>')
        .replace(/`([^`]+)`/g,'<code>$1</code>');
    }
    function render(md){
      const lines=md.split(/\r?\n/);let html='<p class="eyebrow">Agent-Operated Repositories · 01 · English · '+langSwitch+'</p>';let para=[],quote=[],list=[],listType='',code=[],inCode=false,seenH1=false,seenIntro=false,skipPublication=false,afterRule=false;
      const flushPara=()=>{if(para.length){const text=para.join(' ');html+=(afterRule?'<p class="article-note">':'<p>')+inline(text)+(afterRule?'</p>':'</p>');para=[];afterRule=false;}};
      const flushQuote=()=>{if(quote.length){html+='<blockquote><p>'+quote.map(inline).join('<br>')+'</p></blockquote>';quote=[];}};
      const flushList=()=>{if(list.length){html+='<'+listType+'>'+list.map(x=>'<li>'+inline(x)+'</li>').join('')+'</'+listType+'>';list=[];listType='';}};
      const flushCode=()=>{if(code.length){html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=[];}};
      for(let i=0;i<lines.length;i++){
        const raw=lines[i],line=raw.trim();
        if(line.startsWith('```')){flushPara();flushQuote();flushList();if(inCode){flushCode();inCode=false}else inCode=true;continue}
        if(inCode){code.push(raw);continue}
        if(!line){flushPara();flushQuote();flushList();continue}
        if(line==='---'){flushPara();flushQuote();flushList();afterRule=true;continue}
        const img=line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);if(img){flushPara();flushQuote();flushList();const path=img[2].replace(/^assets\//,'/posts/assets/');html+='<figure class="figure-breakout"><img src="'+path+'" alt="'+esc(img[1]).replace(/"/g,'&quot;')+'"></figure>';continue}
        if(line.startsWith('>')){flushPara();flushList();quote.push(line.replace(/^>\s?/,''));continue}
        flushQuote();
        const ul=line.match(/^[-*]\s+(.+)$/),ol=line.match(/^\d+\.\s+(.+)$/);if(ul||ol){flushPara();const type=ul?'ul':'ol';if(listType&&listType!==type)flushList();listType=type;list.push((ul||ol)[1]);continue}
        flushList();
        if(line.startsWith('# ')){flushPara();html+='<h1>'+inline(line.slice(2))+'</h1>';seenH1=true;continue}
        if(seenH1&&!seenIntro&&/^\*[^*]+\*$/.test(line)){flushPara();html+='<p class="intro">'+inline(line.slice(1,-1))+'</p>';seenIntro=true;skipPublication=true;continue}
        if(skipPublication&&/^\*[^*]+\*$/.test(line)){html+='<p class="article-meta">Originally written in July 2026 · Lightly edited for publication September 17, 2026</p>';skipPublication=false;continue}
        if(line.startsWith('## ')){flushPara();html+='<h2>'+inline(line.slice(3))+'</h2>';continue}
        para.push(line);
      }
      flushPara();flushQuote();flushList();flushCode();post.innerHTML=html;
    }
    fetch(src,{cache:'no-store'}).then(r=>r.text()).then(render).catch(()=>{post.innerHTML='<p>Unable to load post.</p>'});
  </script>
</body>
</html>
