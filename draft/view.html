<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft Preview - Lucy Bai</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/style.css">
  <style>
    .figure{margin:2rem 0}.figure img{display:block;width:100%;max-width:980px;height:auto;border-radius:24px}
    .draft-error{border-top:1px solid var(--line);padding-top:20px;color:var(--muted)}
    .draft-tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 42px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .draft-tool{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--text);text-decoration:none;font-size:14px;background:#fff;cursor:pointer}.draft-tool:hover{text-decoration:none;background:#f7f7f7}
    #post table{width:100%;border-collapse:collapse;margin:24px 0;font-size:14px;line-height:1.45}#post th,#post td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}#post th{font-weight:600;background:#fafafa}
    @media(max-width:700px){#post table{display:block;overflow-x:auto;white-space:nowrap}}
  </style>
</head>
<body>
  <main class="page">
    <header class="site-header">
      <a class="logo" href="/">Lucy Bai</a>
      <nav>
        <a href="/draft.html">Drafts</a>
        <a href="/parkinglot/">Parking Lot</a>
        <a href="/writing.html">Notes</a>
        <a href="/projects.html">Projects</a>
      </nav>
    </header>
    <div id="draft-tools"></div>
    <article id="post"><p>Loading draft…</p></article>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const file=params.get('file');
    const post=document.getElementById('post');
    const tools=document.getElementById('draft-tools');
    if(file==='20260709-research-parking-lot.md') location.replace('/parkinglot/');
    function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
    function escapeAttr(s){return escapeHtml(s).replace(/"/g,'&quot;');}
    function inline(s){return escapeHtml(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>');}
    function slugify(s){return s.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').replace(/^-+|-+$/g,'');}
    function dateFromFile(name){const m=name.match(/^(\d{4})(\d{2})(\d{2})-/);return m?`${m[1]}.${m[2]}.${m[3]}`:'Draft';}
    function splitTableRow(line){return line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim());}
    function copyPublish(command){navigator.clipboard.writeText(command).then(()=>alert('Copied: '+command)).catch(()=>alert(command));}
    function renderTools(meta){
      const parts=[];
      if(meta.alternate&&meta.alternate.file)parts.push('<a class="draft-tool" href="/draft/view.html?file='+encodeURIComponent(meta.alternate.file)+'">'+escapeHtml(meta.alternate.label||'Alternate language')+'</a>');
      parts.push('<a class="draft-tool" href="/draft/'+encodeURIComponent(file)+'">Markdown</a>');
      if(meta.publish_slug)parts.push('<button class="draft-tool" id="copy-publish">Copy publish command</button>');
      tools.innerHTML=parts.join('');
      const button=document.getElementById('copy-publish');if(button)button.addEventListener('click',()=>copyPublish('publish '+meta.publish_slug));
    }
    function render(md,meta){
      const lines=md.split(/\r?\n/);
      const headings=lines.filter(l=>l.trim().startsWith('## ')).map(l=>l.trim().slice(3));
      const used={};
      const ids=headings.map(h=>{let base=slugify(h)||'section';let id=base;used[base]=(used[base]||0)+1;if(used[base]>1)id=base+'-'+used[base];return id;});
      const toc=headings.length?'<nav class="toc"><p class="toc-title">'+(meta.language==='中文'?'目录':'Map')+'</p>'+headings.map((h,i)=>'<a href="#'+ids[i]+'">'+inline(h)+'</a>').join('')+'</nav>':'';
      const alt=meta.alternate&&meta.alternate.file?' · <a href="/draft/view.html?file='+encodeURIComponent(meta.alternate.file)+'">'+escapeHtml(meta.alternate.label||'Alternate language')+'</a>':'';
      let html='<p class="eyebrow">'+dateFromFile(file)+' · '+escapeHtml(meta.language||'Draft')+alt+'</p>';
      let para=[],quote=[],list=[],listType='',h2Index=0,seenH1=false,insertedToc=false,usedIntro=false,inCode=false,code=[];
      function maybeToc(){if(seenH1&&usedIntro&&!insertedToc&&toc){html+=toc;insertedToc=true;}}
      function flushPara(){if(para.length){html+='<p>'+inline(para.join(' '))+'</p>';para=[];maybeToc();}}
      function flushQuote(){if(quote.length){html+='<blockquote><p>'+quote.map(inline).join('<br>')+'</p></blockquote>';quote=[];maybeToc();}}
      function flushList(){if(list.length){html+='<'+listType+'>'+list.map(item=>'<li>'+inline(item)+'</li>').join('')+'</'+listType+'>';list=[];listType='';maybeToc();}}
      function flushCode(){if(code.length){html+='<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>';code=[];maybeToc();}}
      for(let i=0;i<lines.length;i++){
        const raw=lines[i];
        if(raw.trim().startsWith('```')){flushPara();flushQuote();flushList();if(inCode){flushCode();inCode=false;}else{inCode=true;}continue;}
        if(inCode){code.push(raw);continue;}
        const line=raw.trim();
        if(!line){flushPara();flushQuote();flushList();continue;}
        if(line.startsWith('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+/.test(lines[i+1])){
          flushPara();flushQuote();flushList();const headers=splitTableRow(line);i++;const rows=[];while(i+1<lines.length&&lines[i+1].trim().startsWith('|'))rows.push(splitTableRow(lines[++i]));html+='<table><thead><tr>'+headers.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+headers.map((_,j)=>'<td>'+inline(row[j]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';maybeToc();continue;
        }
        const img=line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);if(img){flushPara();flushQuote();flushList();html+='<figure class="figure"><img src="'+escapeAttr(img[2])+'" alt="'+escapeAttr(img[1])+'"></figure>';maybeToc();continue;}
        if(line.startsWith('>')){flushPara();flushList();quote.push(line.replace(/^>\s?/,''));continue;}
        flushQuote();
        const ul=line.match(/^[-*]\s+(.+)$/);const ol=line.match(/^\d+\.\s+(.+)$/);if(ul||ol){flushPara();const type=ul?'ul':'ol';if(listType&&listType!==type)flushList();listType=type;list.push((ul||ol)[1]);continue;}
        flushList();
        if(line.startsWith('# ')){flushPara();html+='<h1>'+inline(line.slice(2))+'</h1>';seenH1=true;document.title=line.slice(2)+' - Lucy Bai';continue;}
        if(seenH1&&!usedIntro&&/^\*[^*]+\*$/.test(line)){flushPara();html+='<p class="intro">'+inline(line.replace(/^\*|\*$/g,''))+'</p>';usedIntro=true;maybeToc();continue;}
        if(line.startsWith('## ')){flushPara();const title=line.slice(3);html+='<h2 id="'+ids[h2Index++]+'">'+inline(title)+'</h2>';continue;}
        if(line.startsWith('### ')){flushPara();html+='<h3>'+inline(line.slice(4))+'</h3>';continue;}
        para.push(line);
      }
      flushPara();flushQuote();flushList();flushCode();if(!insertedToc&&toc)html+=toc;post.innerHTML=html;
    }
    async function load(){
      if(!file||!/^\d{8}-[a-z0-9-]+\.md$/i.test(file)){post.innerHTML='<p class="draft-error">Invalid draft file.</p>';return;}
      let meta={language:/-zh\.md$/i.test(file)?'中文':'English',publish_slug:file.replace(/^\d{8}-/,'').replace(/\.md$/,'')};
      try{const r=await fetch('/draft/meta.json',{cache:'no-store'});if(r.ok){const all=await r.json();if(all[file])meta={...meta,...all[file]};}}catch(_){}
      renderTools(meta);
      try{const r=await fetch('/draft/'+encodeURIComponent(file),{cache:'no-store'});if(!r.ok)throw new Error('not found');render(await r.text(),meta);}catch(_){post.innerHTML='<p class="draft-error">Unable to load draft.</p>';}
    }
    load();
  </script>
</body>
</html>
